<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurnosRed – Cliente Socket.IO</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #f7f9fc;
        color: #1f3a5f;
      }
      h1 {
        color: #1f3a5f;
      }
      #estado {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        display: inline-block;
        font-weight: bold;
      }
      .conectado {
        background: #c6efce;
        color: #1b5e20;
      }
      .desconectado {
        background: #ffc7ce;
        color: #c62828;
      }
      #log {
        margin-top: 1.5rem;
        background: white;
        border: 1px solid #d9e2f3;
        border-radius: 6px;
        padding: 1rem;
        max-height: 500px;
        overflow-y: auto;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 13px;
      }
      .evento {
        padding: 8px;
        margin-bottom: 6px;
        border-left: 4px solid #1f3a5f;
        background: #f0f4fa;
      }
      .evento.nuevo {
        border-color: #2e7d32;
      }
      .evento.actualizado {
        border-color: #f9a825;
      }
      .evento.eliminado {
        border-color: #c62828;
      }
      .evento time {
        color: #666;
        font-size: 11px;
      }
      pre {
        margin: 0.3rem 0 0 0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>TurnosRed – Cliente Socket.IO</h1>
    <p>
      Estado de la conexión: <span id="estado" class="desconectado">Desconectado</span>
    </p>
    <p>
      Esta página se conecta al servidor por WebSocket y recibe en vivo cada evento (nuevo,
      actualizado, eliminado) sin recargar.
    </p>
    <div id="log"></div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const estadoEl = document.getElementById('estado');
      const logEl = document.getElementById('log');
      const socket = io('http://localhost:3000');

      socket.on('connect', () => {
        estadoEl.textContent = 'Conectado (' + socket.id + ')';
        estadoEl.className = 'conectado';
        agregar('sistema', 'Socket conectado');
      });

      socket.on('disconnect', () => {
        estadoEl.textContent = 'Desconectado';
        estadoEl.className = 'desconectado';
        agregar('sistema', 'Socket desconectado');
      });

      socket.on('turno:nuevo', (payload) => agregar('nuevo', 'turno:nuevo', payload));
      socket.on('turno:actualizado', (payload) =>
        agregar('actualizado', 'turno:actualizado', payload),
      );
      socket.on('turno:eliminado', (payload) =>
        agregar('eliminado', 'turno:eliminado', payload),
      );

      function agregar(tipo, titulo, payload) {
        const div = document.createElement('div');
        div.className = 'evento ' + tipo;
        const hora = new Date().toLocaleTimeString();
        div.innerHTML =
          '<strong>' +
          titulo +
          '</strong> <time>' +
          hora +
          '</time>' +
          (payload ? '<pre>' + JSON.stringify(payload, null, 2) + '</pre>' : '');
        logEl.prepend(div);
      }
    </script>
  </body>
</html>
